name: Build SQL Semantic Compare Tool EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-sql-semantic-workflow-exe.yml"
      - "requirements.txt"
      - "交付_exe版/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd lxml pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          cd /d "交付_exe版"
          pyinstaller --noconfirm --clean --onefile --windowed --icon sql_compare_tool.ico --name SQL语义比对工具 sql_semantic_workflow_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQL语义比对工具-Windows-EXE
          path: 交付_exe版/dist/SQL语义比对工具.exe
